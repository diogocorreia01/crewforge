[project]
name = "crewforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diogo Correia", email = "diogo.f.correia@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.4",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
crewforge = "crewforge:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]